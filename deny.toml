# `cargo deny check licenses` for the source-available workspace.
[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# The workspace crates themselves; licensed at the repository level.
private = { ignore = true }
